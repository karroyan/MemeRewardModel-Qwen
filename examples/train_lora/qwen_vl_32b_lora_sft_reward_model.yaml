### model
model_name_or_path: /fs-computility/niuyazhe/shared/VLM/QwenVL/Qwen2.5-VL-32B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: rm_class
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: boring_detailed_train, boringmeme_train, irrelevantmeme_train, lowperformancememe_train, object_add_train, object_changed_train
template: qwen2_vl
cutoff_len: 2048
max_samples: 1000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen_vl_32b/rm_class
logging_steps: 10
save_steps: 2200
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: tensorboard  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

